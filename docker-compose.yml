services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    command: uvicorn audittrace.api:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    command: streamlit run src/audittrace/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
