[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audittrace"
version = "1.0.0"
description = "Outil de tests d'écritures comptables avec anomalies traçables et expliquées (ISA 240)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AuditTrace Team"}
]

dependencies = [
    "pandas>=2.1",
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "duckdb>=0.9",
    "pyarrow>=14.0",
    "xlsxwriter>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "tabulate>=0.9.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "requests>=2.31",
    "streamlit>=1.30",
]

[project.optional-dependencies]
rag = [
    "langchain>=0.1",
    "langchain-community>=0.0.10",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = ["audittrace[rag,dev]"]

[project.scripts]
audittrace = "audittrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
